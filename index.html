<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
   
<div class="form_Container">
        <form id="form">
        <label for="eventTitle">Event Title:</label>
        <input type="text" id="eventTitle"  required><br>

        <label for="eventDate">Event Date:</label>
        <input type="date" id="eventDate"  required><br>

        <label for="category">Category:</label>
        <select id="category" required>
            <option value="Conference">Conference</option>
            <option value="Workshop">Workshop</option>
            <option value="Meetup">Meetup</option>
            <option value="Webinar">Webinar</option>
            <option value="Social">Social</option>
        </select><br>

        <label for="Description">Description:</label>
        <textarea id="Description" rows="4" required></textarea><br>

        <button type="submit" class="btn" values="Add Event">Add Event</button>
    </form>
</div>

<div class="events">
    <button>Clear All Events</button>
    <button>Sample All Events</button>
    <div class="event_Cards"></div>
</div>
</body>
</html>
