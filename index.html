<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Event Dashboard</title>
<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>
</head>
<body>

<h1 class="title">Smart Event Dashboard</h1>

<div class="main">

    <!-- LEFT FORM -->
    <div class="card formCard">
        <h2>Add New Event</h2>

        <form id="form">
            <label>Event Title:</label>
            <input type="text" id="eventTitle" required>

            <label>Event Date:</label>
            <input type="date" id="eventDate" required>

            <label>Category:</label>
            <select id="category">
                <option>Conference</option>
                <option>Workshop</option>
                <option>Meetup</option>
                <option>Webinar</option>
                <option>Social</option>
            </select>

            <label>Description:</label>
            <textarea id="Description" rows="4"></textarea>

            <button class="addBtn">Add Event</button>
        </form>
    </div>

    <!-- RIGHT EVENTS -->
    <div class="card eventsCard">
        <h2>My Events</h2>

        <div class="topBtns">
            <button id="clear">Clear All Events</button>
            <button id="sample">Add Sample Events</button>
        </div>

        <div class="event_Cards"></div>
    </div>

    <div class="domBox">
        <h2>DOM Manipulation Demo</h2>

        <div class="keyBox">
            You Pressed: <span id="key">None</span>
        </div>
    </div>

</div>

</body>
</html>
